<nav class="modern-nav" [class.scrolled]="isScrolled">
  <div class="nav-inner">
    <a class="brand" routerLink="/" aria-label="Navigate home">
      <span class="brand-mark"></span>
      <div class="brand-copy">
        <span class="brand-title">01BLOG</span>
        <span class="brand-tagline">Stories for curious minds</span>
      </div>
    </a>

    <button class="menu-toggle" type="button" (click)="toggleMenu()" aria-label="Toggle menu">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <div class="nav-controls" [class.open]="menuOpen">
      <ng-container *ngIf="UserResponse; else auth">
        <div class="quick-actions">
          <button class="icon-btn" routerLink="/adduser" aria-label="Add user">
            <i class="bi bi-person-plus"></i>
          </button>
          <button class="icon-btn" routerLink="/notification" aria-label="View notifications">
            <i class="bi bi-bell"></i>
          </button>
          <button class="icon-btn" routerLink="/newpost" aria-label="Create post">
            <i class="bi bi-plus-lg"></i>
          </button>
          <button class="icon-btn" *ngIf="UserResponse?.role === 'ADMIN_USER'" routerLink="/admin" aria-label="Admin dashboard">
            <i class="bi bi-shield-fill"></i>
          </button>
          <a class="user-pill" [routerLink]="['/profile', UserResponse.username]" aria-label="Profile">
            <span class="username">{{ UserResponse.username }}</span>
          </a>
          <button class="icon-btn" type="button" (click)="Logout()" aria-label="Logout">
            <i class="bi bi-box-arrow-right"></i>
          </button>
        </div>
      </ng-container>
      <ng-template #auth>
        <div class="auth-links">
          <a routerLink="/login">Login</a>
          <a routerLink="/register" class="primary">Register</a>
        </div>
      </ng-template>
    </div>
  </div>
</nav>
