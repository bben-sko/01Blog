<nav class="navbar navbar-light bg-white sticky-top shadow-sm">
  <div class="container-fluid navbar-container">
    <!-- Brand -->
    <a class="navbar-brand" routerLink="/">
      <h2 class="mb-0 brand-text">01BLOG</h2>
    </a>
    
    <!-- Actions -->
    <div class="d-flex align-items-center gap-2 navbar-actions">
      <!-- Add User -->
      <button class="btn btn-icon" 
              routerLink="/adduser" 
              title="Add User"
              aria-label="Add User">
        <i class="bi bi-person-plus"></i>
      </button>
      
      <!-- Notifications -->
      <button class="btn btn-icon position-relative" 
              title="Notifications"
              routerLink="/notification" 
              aria-label="Notifications">
        <i class="bi bi-bell"></i>
        <!-- Notification badge (optional) -->
        <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger d-none">
          3
          <span class="visually-hidden">unread notifications</span>
        </span>
      </button>
      
      <!-- Create Post -->
      <button class="btn btn-icon" 
              routerLink="/newpost" 
              title="Create Post"
              aria-label="Create Post">
        <i class="bi bi-plus-lg"></i>
      </button>
      
      <!-- Profile -->
      <button class="btn btn-icon" 
              [routerLink]="[`/profile/${profileusername}`]" 
              title="Profile"
              aria-label="Profile">
        <i class="bi bi-person-fill"></i>
      </button>
    </div>
  </div>
</nav>
