<div class="post-card">
  <!-- Post Header -->
  <div class="post-header">
    <div class="user-info">
      <img  src="https://img.freepik.com/free-photo/starry-clear-sky-view-with-nature-landscape_23-2151683112.jpg?ga=GA1.1.1543395655.1759957868&semt=ais_hybrid&w=740&q=80"
           alt="User avatar" 
           class="avatar">
      <div class="user-details">
        <h3 class="username">{{ post.username }}</h3>
        <span class="timestamp">{{ post.createdAt | date:'short' }}</span>
      </div>
    </div>
    
    <!-- Three-dot Menu -->
  
  </div>

  <!-- Post Content -->
  <div class="post-content">
    <p *ngIf="post.content">{{ post.content }}</p>
    
    <!-- Image -->
    <!-- <img *ngIf="post.imageUrl" 
           src="https://img.freepik.com/free-photo/starry-clear-sky-view-with-nature-landscape_23-2151683112.jpg?ga=GA1.1.1543395655.1759957868&semt=ais_hybrid&w=740&q=80"
         alt="Post image" 
         class="post-media">
    
     <video *ngIf="post.videoUrl" 
           [src]="post.videoUrl" 
           controls 
           class="post-media">
      Your browser does not support the video tag.
    </video>  -->
  </div>

  <!-- Post Actions -->
  <div class="post-actions">   
    <div class="action-buttons">
      <button class="action-btn"  
              (click)="getMoreInfo(post.postId)">
       More...
      </button>
    </div>
  </div>
</div>
