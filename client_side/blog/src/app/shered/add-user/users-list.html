<section class="users-shell">
  <div class="users-panel">
    <header class="panel-header">
      <div>
        <p class="eyebrow">Community</p>
        <h1>Discover creators to follow</h1>
      </div>
      <div class="search-box">
        <input type="search" placeholder="Search by username" [(ngModel)]="searchTerm" (ngModelChange)="onSearchTermChange()">
      </div>
    </header>

    <div class="loading" *ngIf="loading">
      <div class="spinner"></div>
      <p>Finding inspiring voices…</p>
    </div>

    <div class="users-grid" *ngIf="!loading && users.length">
      <article class="user-card" *ngFor="let user of users">
        <div class="identity" (click)="viewProfile(user.user.username)">
          <img [src]="user.user.avatar || 'assests/avatar-default.jpeg'" [alt]="user.user.username" (error)="$event.target.src='avatar-default.jpeg'">
          <div>
            <h3>{{ user.user.name || user.user.username }}</h3>
            <p>@{{ user.user.username }}</p>
          </div>
        </div>
        <div class="actions">
          <button class="ghost" type="button" (click)="viewProfile(user.user.username)">View profile</button>
          <button class="primary" type="button" (click)="toggleFollow(user)">
            {{ user.isfollow ? 'Unfollow' : 'Follow' }}
          </button>
        </div>
      </article>
    </div>

    <div class="empty-state" *ngIf="!loading && !users.length">
      <span class="icon">👥</span>
      <p>No users found.</p>
    </div>

    <div class="load-more" *ngIf="!loading && hasMore">
      <button type="button" (click)="showMore()">Load more</button>
    </div>
  </div>
</section>
