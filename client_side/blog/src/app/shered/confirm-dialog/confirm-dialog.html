<div class="modal" [style.display]="open ? 'block' : 'none'" style="background-color: rgba(0,0,0,0.5);">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">{{ title }}</h5>
        <button type="button" class="btn-close" (click)="onCancel()"></button>
      </div>
      <div class="modal-body">
        <p>{{ message }}</p>
        <p *ngIf="description">{{ description }}</p>
        <div *ngIf="error" class="alert alert-danger">{{ error }}</div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" (click)="onCancel()" [disabled]="loading">{{ cancelLabel }}</button>
        <button type="button" class="btn btn-primary" (click)="onConfirm()" [disabled]="loading">{{ confirmLabel }}</button>
      </div>
    </div>
  </div>
</div>
