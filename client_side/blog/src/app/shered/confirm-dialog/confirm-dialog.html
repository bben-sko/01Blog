<div class="confirm-overlay" *ngIf="open" (click)="onCancel()">
  <div class="confirm-dialog" (click)="$event.stopPropagation()">
    <div class="dialog-header">
      <h3>{{ title }}</h3>
      <button class="icon-btn" type="button" (click)="onCancel()">
        <i class="bi bi-x"></i>
      </button>
    </div>
    <div class="dialog-body">
      <p class="message">{{ message }}</p>
      <p class="description" *ngIf="description">{{ description }}</p>
      <div *ngIf="error" class="error">{{ error }}</div>
    </div>
    <div class="dialog-actions">
      <button type="button" class="ghost" (click)="onCancel()" [disabled]="loading">
        {{ cancelLabel }}
      </button>
      <button type="button" class="primary" (click)="onConfirm()" [disabled]="loading">
        {{ confirmLabel }}
      </button>
    </div>
  </div>
</div>
