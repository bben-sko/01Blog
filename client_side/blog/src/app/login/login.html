<section class="auth-shell">
  <div class="auth-panel">
    <div class="hero-pane">
      <p class="eyebrow">Welcome back</p>
      <h1>Sign in to continue exploring thoughtful stories.</h1>
      <p class="subcopy">Your personalized feed, saved posts, and publishing tools are just one step away.</p>
    </div>
    <div class="form-pane">
      <h2>Log in</h2>
      <p class="helper">Don't have an account? <a [routerLink]="'/register'">Create one</a></p>

      <div class="field">
        <label for="email">Email</label>
        <input id="email"
               type="email"
               [(ngModel)]="dataLogin.userEmail"
               [class.invalid]="error"
               placeholder="you@email.com">
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input id="password"
               type="password"
               [(ngModel)]="dataLogin.password"
               [class.invalid]="error"
               placeholder="••••••••">
      </div>

      <button type="button" class="primary" (click)="d()">Sign in</button>

      <p class="error" *ngIf="error">{{ error }}</p>
    </div>
  </div>
</section>
