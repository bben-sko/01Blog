<app-nav-bar />
<div class="post-detail-container">
  <div class="post-card" *ngIf="post">
    <!-- Post Header -->
    <div class="post-header">
      <div class="user-info">
        <img src="https://img.freepik.com/free-photo/starry-clear-sky-view-with-nature-landscape_23-2151683112.jpg"
          alt="User avatar" class="avatar">
        <div class="user-details">
          <h3 class="username">{{ post.username }}</h3>
          <!-- <h3 class="username">asd</h3> -->

          <!-- <span class="timestamp">{{ post.createdAt  }}</span> -->
        </div>
      </div>

      <!-- Three-dot Menu - only show if it's not user's own post -->
      <div class="menu-container" *ngIf="!post.ismy">
        <button class="menu-button" (click)="toggleMenu()">
          <span class="three-dots">⋮</span>
        </button>

        <div class="menu-dropdown" *ngIf="showMenu">
          <button (click)="reportPost('spam')">
            <span class="icon">🚫</span> Report as Spam
          </button>
          <button (click)="reportPost('inappropriate')">
            <span class="icon">⚠️</span> Report as Inappropriate
          </button>
          <button (click)="reportPost('harassment')">
            <span class="icon">🛑</span> Report Harassment
          </button>
          <button (click)="reportPost('other')">
            <span class="icon">📝</span> Other
          </button>
        </div>
      </div>

      <!-- Edit/Delete buttons for own posts -->
      <div class="post-owner-actions" *ngIf="post.ismy">
        <button class="edit-btn" (click)="editPost()">
          <span class="icon">✏️</span> Edit
        </button>
        <button class="delete-btn" (click)="deletePost()">
          <span class="icon">🗑️</span> Delete
        </button>
      </div>
    </div>

    <!-- Post Content -->
    <div class="post-content">
      <p *ngIf="post.content">{{post.content }}</p>

      <!-- Media Display -->
      <div *ngIf="post.media && post.media.length > 0" class="media-container">
        <!-- <ng-container *ngFor="let mediaUrl of post.media">
         
          <img *ngIf="isImage(mediaUrl)" [src]="mediaUrl" alt="Post image" class="post-media">

         
          <video *ngIf="isVideo(mediaUrl)" [src]="mediaUrl" controls class="post-media">
            Your browser does not support the video tag.
          </video>
        </ng-container> -->
      </div>
    </div>

    <!-- Post Actions -->
    <div class="post-actions">
      <div class="action-buttons">
        <button class="action-btn" [class.liked]="true" (click)="toggleLike()">
          <span class="icon">{{ true ? '❤️' : '🤍' }}</span>
          Like
        </button>

        <button class="action-btn" (click)="toggleComments()">
          <span class="icon">💬</span>
          Comment
        </button>
      </div>
    </div>

    <!-- Comments Section -->
    <div class="comments-section" *ngIf="showComments">
      <h4>Comments</h4>

      <!-- No Comments Message -->
      <div *ngIf="!post.comments || post.comments.length === 0" class="no-comments">
        <p>No comments yet. Be the first to comment!</p>
      </div>

      <!-- Comment List -->
      <div class="comment" *ngFor="let comment of post.comments">
        <div class="comment-header">
          <strong>{{ comment.username }}</strong>
          <span class="comment-time">{{ comment}}</span>
        </div>
        <p>{{ comment.content }}</p>

        <!-- Comment Actions for own comments -->


        <!-- Nested Replies -->
       

        <!-- Reply Button -->

      </div>

      <!-- Add Comment -->
      <div class="add-comment">
        <input type="text" [(ngModel)]="newComment" placeholder="Write a comment..." (keyup.enter)="addComment()"
          [disabled]="isSubmitting">
        <button (click)="addComment()" [disabled]="!newComment.trim() || isSubmitting">
          {{ isSubmitting ? 'Posting...' : 'Post' }}
        </button>
      </div>
    </div>
  </div>

  <!-- Loading State -->
  <div class="loading" *ngIf="!post">
    <div class="spinner"></div>
    <p>Loading post...</p>
  </div>

  <!-- Error State -->
  <!-- <div class="error" *ngIf="error"> -->
    <!-- <p>{{ error }}</p> -->
    <button (click)="goBack()">Go Back</button>
  <!-- </div> -->
</div>
