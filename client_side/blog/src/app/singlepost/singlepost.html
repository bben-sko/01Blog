<app-nav-bar />
<div class="container py-4">
  <!-- Post Card -->
  <div class="card post-card shadow-sm" *ngIf="post">
    <!-- Header -->
    <div class="card-header bg-white d-flex justify-content-between align-items-center">
      <div class="d-flex align-items-center">
        <img [src]="post.avatar ? post.avatar : 'https://img.freepik.com/free-photo/starry-clear-sky-view-with-nature-landscape_23-2151683112.jpg?ga=GA1.1.1543395655.1759957868&semt=ais_hybrid&w=740&q=80'" 
             [alt]="post.username" 
             class="avatar me-3"
             (error)="$event.target.src='https://img.freepik.com/free-photo/starry-clear-sky-view-with-nature-landscape_23-2151683112.jpg?ga=GA1.1.1543395655.1759957868&semt=ais_hybrid&w=740&q=80'">
        <div>
          <div class="username">{{ post.username }}</div>
          <div class="timestamp">{{ post.createdAt }}</div>
        </div>
      </div>
      
      <!-- More Options -->
      <div *ngIf="!post.ismy">
        <button class="btn btn-link text-secondary more-btn" (click)="openReportModal()">
          <i class="bi bi-three-dots-vertical"></i>
        </button>
      </div>
      
      <!-- Owner Actions -->
      <div *ngIf="post.ismy" class="d-flex gap-2">
        <button class="btn btn-sm btn-outline-primary" (click)="editPost()">
          <i class="bi bi-pencil"></i> Edit
        </button>
        <button class="btn btn-sm btn-outline-danger" (click)="deletePost()">
          <i class="bi bi-trash"></i> Delete
        </button>
      </div>
    </div>
    
    <!-- Content -->
    <div class="card-body">
      <p class="post-content" *ngIf="post.content">{{ post.content }}</p>
      
      <!-- Media -->
      <div class="media-container" *ngIf="post.media?.length">
        <img *ngFor="let mediaUrl of post.media" 
             [src]="mediaUrl" 
             alt="Post media" 
             class="post-media">
      </div>
    </div>
    
    <!-- Actions -->
    <div class="card-footer bg-white d-flex gap-2">
      <button class="btn action-btn" 
              [class.liked]="post.likedByUser" 
              (click)="toggleLike(post.postId)">
        <i class="bi" [ngClass]="post.likedByUser ? 'bi-heart-fill' : 'bi-heart'"></i>
        {{ post.likedByUser ? 'Liked' : 'Like' }}
      </button>
      <button class="btn action-btn" (click)="toggleComments()">
        <i class="bi bi-chat"></i>
        Comment
      </button>
    </div>
    
    <!-- Comments Section -->
    <div class="comments-section" *ngIf="showComments">
      <!-- Add Comment -->
      <div class="add-comment-box p-3 border-top">
        <div class="input-group">
          <input type="text" 
                 class="form-control comment-input" 
                 [(ngModel)]="newComment" 
                 (keyup.enter)="addComment(post.postId)"
                 [disabled]="isSubmitting"
                 placeholder="Write a comment...">
          <button class="btn btn-primary ms-2 px-4" 
                  (click)="addComment(post.postId)"
                  [disabled]="!newComment?.trim() || isSubmitting">
            {{ isSubmitting ? 'Posting...' : 'Post' }}
          </button>
        </div>
      </div>
      
      <!-- Comments List -->
      <div class="comments-list p-3 bg-light">
        <div *ngFor="let comment of comments" class="comment-item mb-3">
          <div class="d-flex gap-3">
            <img [src]="comment.avatar ? comment.avatar : 'https://img.freepik.com/free-photo/starry-clear-sky-view-with-nature-landscape_23-2151683112.jpg?ga=GA1.1.1543395655.1759957868&semt=ais_hybrid&w=740&q=80'" 
                 [alt]="comment.username" 
                 class="avatar-sm flex-shrink-0"
                 (error)="$event.target.src='https://img.freepik.com/free-photo/starry-clear-sky-view-with-nature-landscape_23-2151683112.jpg?ga=GA1.1.1543395655.1759957868&semt=ais_hybrid&w=740&q=80'">
            <div class="flex-grow-1">
              <div class="comment-bubble">
                <div class="comment-username">{{ comment.username }}</div>
                <p class="comment-text mb-0">{{ comment.content }}</p>
              </div>
              <div class="comment-time">{{ comment.createdAt }}</div>
            </div>
          </div>
        </div>
        
        <div *ngIf="comments.length === 0" class="text-center text-muted py-3">
          No comments yet. Be the first to comment!
        </div>
      </div>
    </div>
  </div>
  
  <!-- Loading State -->
  <div *ngIf="!post" class="text-center py-5">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
    <p class="mt-3 text-muted">Loading post...</p>
  </div>
</div>

<!-- Report Modal -->
<div class="modal fade" 
     [class.show]="showReportModal" 
     [style.display]="showReportModal ? 'block' : 'none'"
     *ngIf="showReportModal">
  <div class="modal-backdrop fade show" (click)="closeReportModal()"></div>
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Report Post</h5>
        <button type="button" class="btn-close" (click)="closeReportModal()"></button>
      </div>
      <div class="modal-body">
        <textarea class="form-control" 
                  rows="5" 
                  [(ngModel)]="reportText" 
                  placeholder="Describe the issue..."></textarea>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" (click)="closeReportModal()">
          Cancel
        </button>
        <button type="button" 
                class="btn btn-danger" 
                (click)="submitReport()"
                [disabled]="!reportText?.trim()">
          Submit Report
        </button>
      </div>
    </div>
  </div>
</div>
