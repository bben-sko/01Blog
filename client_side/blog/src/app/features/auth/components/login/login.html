<div class="login-container">
  <div class="container">
    <div class="row justify-content-center align-items-center min-vh-100">
      <div class="col-12 col-md-8 col-lg-5">
        <div class="card shadow-lg border-0 rounded-4">
          <div class="card-body p-5">

            <!-- Logo/Title Section -->
            <div class="text-center mb-4">
              <div class="mb-3">
                <i class="bi bi-journal-code display-3 text-primary"></i>
              </div>
              <h2 class="fw-bold text-dark mb-2">Welcome Back</h2>
              <p class="text-muted">Sign in to continue to your blog</p>
            </div>

            <!-- Error Alert -->
            <div *ngIf="errorMessage" class="alert alert-danger alert-dismissible fade show" role="alert">
              <i class="bi bi-exclamation-triangle-fill me-2"></i>
              {{ errorMessage }}
              <button type="button" class="btn-close" (click)="errorMessage = ''" aria-label="Close"></button>
            </div>

            <!-- Login Form -->
            <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

              <!-- Username Field -->
              <div class="mb-4">
                <label for="username" class="form-label fw-semibold">
                  <i class="bi bi-person-fill me-2"></i>Username
                </label>
                <input 
                  type="text" 
                  id="username"
                  formControlName="username"
                  class="form-control form-control-lg"
                  [class.is-invalid]="submitted && f['username'].errors"
                  placeholder="Enter your username"
                  autocomplete="username">

                <div *ngIf="submitted && f['username'].errors" class="invalid-feedback d-block">
                  <small *ngIf="f['username'].errors['required']"><i class="bi bi-x-circle me-1"></i>Username is required</small>
                  <small *ngIf="f['username'].errors['minlength']"><i class="bi bi-x-circle me-1"></i>Username must be at least 3 characters</small>
                </div>
              </div>

              <!-- Password Field -->
              <div class="mb-4">
                <label for="password" class="form-label fw-semibold">
                  <i class="bi bi-lock-fill me-2"></i>Password
                </label>
                <input 
                  type="password" 
                  id="password"
                  formControlName="password"
                  class="form-control form-control-lg"
                  [class.is-invalid]="submitted && f['password'].errors"
                  placeholder="Enter your password"
                  autocomplete="current-password">

                <div *ngIf="submitted && f['password'].errors" class="invalid-feedback d-block">
                  <small *ngIf="f['password'].errors['required']"><i class="bi bi-x-circle me-1"></i>Password is required</small>
                  <small *ngIf="f['password'].errors['minlength']"><i class="bi bi-x-circle me-1"></i>Password must be at least 6 characters</small>
                </div>
              </div>

              <!-- Submit Button -->
              <div class="d-grid mb-3">
                <button 
                  type="submit"
                  class="btn btn-primary btn-lg"
                  [disabled]="loading">

                  <span *ngIf="loading" class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
                  <span *ngIf="!loading"><i class="bi bi-box-arrow-in-right me-2"></i>Sign In</span>
                  <span *ngIf="loading">Signing In...</span>
                </button>
              </div>

              <!-- Register Link -->
              <div class="text-center mt-4">
                <p class="mb-0 text-muted">
                  Don't have an account? 
                  <a routerLink="/register" class="text-primary fw-bold text-decoration-none">
                    Sign Up
                  </a>
                </p>
              </div>
            </form>

          </div>
        </div>
      </div>
    </div>
  </div>
</div>
