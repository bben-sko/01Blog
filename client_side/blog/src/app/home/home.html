

<main class="page-shell" id="articles">
  <div class="content-grid">
    <div class="articles-column">
      <div class="article-grid">
        <article class="story-card" *ngFor="let post of posts">
          <div class="card-media">
            <ng-container *ngIf="post.media?.length && post.media[0]; else fallbackMedia">
              <ng-container *ngIf="post.media[0].toLowerCase().endsWith('.mp4'); else imageThumb">
                <video [src]="post.media[0]" controls muted playsinline></video>
              </ng-container>
              <ng-template #imageThumb>
                <img [src]="post.media[0]" [alt]="post.title" loading="lazy">
              </ng-template>
            </ng-container>
            <ng-template #fallbackMedia>
              <img [src]="post.media[0] || 'avatar-default.jpeg'"  [alt]="post.title" loading="lazy">
            </ng-template>
          </div>
          <div class="card-body">
            <h2 (click)="viewPost(post)">{{ post.title }}</h2>
            <div class="card-meta">
              <div class="author-meta">
                <img [src]="post.avatar || 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2240%22 height=%2240%22 viewBox=%220 0 120 120%22%3E%3Crect fill=%22%23e2e8f0%22 width=%22120%22 height=%22120%22/%3E%3Ctext fill=%22%2394a3b8%22 font-family=%22sans-serif%22 font-size=%2240%22 dy=%22.3em%22 x=%2250%25%22 y=%2250%25%22 text-anchor=%22middle%22%3E?%3C/text%3E%3C/svg%3E'"
                     alt="{{ post.username }}"
                     (error)="$event.target.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2240%22 height=%2240%22 viewBox=%220 0 120 120%22%3E%3Crect fill=%22%23e2e8f0%22 width=%22120%22 height=%22120%22/%3E%3Ctext fill=%22%2394a3b8%22 font-family=%22sans-serif%22 font-size=%2240%22 dy=%22.3em%22 x=%2250%25%22 y=%2250%25%22 text-anchor=%22middle%22%3E?%3C/text%3E%3C/svg%3E'">
                <div>
                  <strong>{{ post.username }}</strong>
                  <small>{{ post.createdAt | date: 'MMMM d' }}</small>
                </div>
              </div>
            </div>
            <div class="card-actions">
              <button class="primary" type="button" (click)="viewPost(post)">
                Show post
              </button>
            </div>
          </div>
        </article>
        <div class="empty-state" *ngIf="loading">
          <p>loading...</p>
        </div>
      </div>

      <div class="load-more" *ngIf="!loading">
        <button type="button" (click)="loadMoreStories()" [disabled]="loading || !hasMore ">
          <span *ngIf="loading">Loading stories…</span>
          <span *ngIf="!loading">{{ !hasMore ? 'No more stories' : 'Load more stories' }}</span>
        </button>
      </div>
    </div>

  </div>
</main>

<footer class="site-footer" id="about"> 
  <div class="footer-base">
     <div>
      <h4>01BLOG</h4>
    </div>
    <span>©01BLOG. All rights reserved.</span>
    <button class="back-to-top" type="button" (click)="scrollToTop()">
      Back to top
    </button>
  </div>
</footer>
