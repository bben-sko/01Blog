<app-nav-bar />
<div class="new-post-container">
  <div class="new-post-card">
    <!-- Header -->
    <div class="post-header">
      <h2>Create New Post</h2>
      <button class="close-btn" (click)="cancel()">✕</button>
    </div>

    <!-- User Info -->
    <div class="user-section">
      <img src="https://img.freepik.com/free-photo/starry-clear-sky-view-with-nature-landscape_23-2151683112.jpg?ga=GA1.1.1543395655.1759957868&semt=ais_hybrid&w=740&q=80" alt="Your avatar" class="avatar">
      <div class="user-info">
        <h3>Current User</h3>
        <span class="visibility">Public</span>
      </div>
    </div>

    <!-- Post Content -->
    <div class="post-content-section">
      <textarea 
        [(ngModel)]="postContent"
        placeholder="What's on your mind?"
        class="post-textarea"
        rows="6">
      </textarea>

      <!-- Image Preview -->
      <div class="media-preview" *ngIf="imagePreview">
        <button class="remove-media-btn" (click)="removeImage()">✕</button>
        <img [src]="imagePreview" alt="Preview" class="preview-image">
      </div>

      <!-- Video Preview -->
      <div class="media-preview" *ngIf="videoPreview">
        <button class="remove-media-btn" (click)="removeVideo()">✕</button>
        <video [src]="videoPreview" controls class="preview-video"></video>
      </div>
    </div>

    <!-- Media Options -->
    <div class="media-options">
      <span class="add-to-post">Add to your post:</span>
      
      <div class="media-buttons">
        <label class="media-btn" title="Add Photo">
          <input 
            type="file" 
            accept="image/*" 
            (change)="onImageSelected($event)"
            hidden>
          <span class="icon">🖼️</span>
          Photo
        </label>

        <label class="media-btn" title="Add Video">
          <input 
            type="file" 
            accept="video/*" 
            (change)="onVideoSelected($event)"
            hidden>
          <span class="icon">🎥</span>
          Video
        </label>
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="action-buttons">
      <button class="cancel-btn" (click)="cancel()">Cancel</button>
      <button class="post-btn" (click)="createPost()">Post</button>
    </div>
  </div>
</div>
