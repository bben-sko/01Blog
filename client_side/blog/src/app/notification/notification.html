<!-- Add this to your navbar or header component -->
<div class="dropdown" dropdown>
    <button class="btn btn-link position-relative" dropdownToggle type="button" id="notificationDropdown"
        aria-expanded="false">
        <i class="bi bi-bell fs-4"></i>
        <!-- Badge for unread count -->
        <span *ngIf="(unreadCount$ | async) > 0"
            class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
            {{ unreadCount$ | async }}
        </span>
    </button>

    <ul *dropdownMenu class="dropdown-menu dropdown-menu-end notification-dropdown"
        aria-labelledby="notificationDropdown">
        <li class="dropdown-header d-flex justify-content-between align-items-center">
            <strong>Notifications</strong>
        </li>
        <li>
            <hr class="dropdown-divider">
        </li>

        <!-- Notification list -->
        <div class="notification-list">
            <li *ngFor="let notification of notifications$ | async">
                <a class="dropdown-item notification-item" [class.unread]="!notification.isRead"
                    (click)="onNotificationClick(notification)">
                    <div class="d-flex justify-content-between align-items-start">
                        <div class="notification-content">
                            <p class="mb-1">{{ notification.message }}</p>
                            <!-- <small class="text-muted">{{ notification.createdAt | "date: 'short'" }}</small> -->
                            <small class="text-muted">date</small>
                        </div>
                        <span *ngIf="!notification.isRead" class="badge bg-primary ms-2">New</span>
                    </div>
                    <button class="btn btn-sm btn-outline-primary mt-2 w-100">
                        Go to Post
                    </button>
                </a>
            </li>

            <!-- Empty state -->
            <li *ngIf="notification.length === 0" class="dropdown-item text-center text-muted py-4">
                No notifications
            </li>
        </div>
    </ul>
</div>
