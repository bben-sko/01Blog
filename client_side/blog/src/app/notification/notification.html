<!-- notification-page.component.html -->
<app-nav-bar />

<div class="container mt-4">
    <div class="row">
        <div class="col-lg-8 offset-lg-2">

            <!-- Header Section -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="mb-0">
                    <i class="bi bi-bell me-2"></i>Notifications
                    <span *ngIf="unreadCount > 0" class="badge bg-danger ms-2">{{ unreadCount }}</span>
                </h2>
            </div>

            

            <!-- Notifications List -->
            <div class="notifications-container">
                @if (notifications.length > 0) {

                
                <div *ngFor="let notification of notifications" class="notification-card"
                    [class.unread]="!notification.isRead" (click)="onNotificationClick(notification)">

                    <div class="notification-header d-flex justify-content-between align-items-start">
                        <div class="flex-grow-1">
                            <div class="d-flex align-items-center mb-2">
                                <i class="bi bi-file-text text-primary me-2 fs-5"></i>
                                <span *ngIf="!notification.isRead" class="badge bg-primary me-2">New</span>
                                <small class="text-muted">{{ notification.createdAt | date: 'MMM d, y, h:mm a'
                                    }}</small>
                            </div>

                            <p class="notification-message mb-2">{{ notification.message }}</p>

                            <div class="notification-actions mt-3">
                                <button class="btn btn-sm btn-primary me-2" (click)="shoewpost(notification.postId)">
                                    <i class="bi bi-box-arrow-up-right me-1"></i>Go to Post
                                </button>
                                <button *ngIf="!notification.isRead" class="btn btn-sm btn-outline-secondary me-2"
                                   >
                                    <i class="bi bi-check me-1"></i>Mark as read
                                </button>
                                <button class="btn btn-sm btn-outline-danger"
                                    >
                                    <i class="bi bi-trash me-1"></i>Delete
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            }@else {
                <p>no notification</p>
            }
               
            </div>

        </div>
    </div>
</div>
