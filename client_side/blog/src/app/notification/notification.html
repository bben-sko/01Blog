<section class="notification-shell">
  <div class="notification-panel">
    <header class="panel-header">
      <div>
        <p class="eyebrow">Activity</p>
        <h1>Notifications</h1>
      </div>
      <span *ngIf="unreadCount" class="pill">{{ unreadCount }} new</span>
    </header>

    <div class="loading" *ngIf="loading">
      <div class="spinner"></div>
      <p>Syncing recent activity…</p>
    </div>

    <div class="notifications-list" *ngIf="!loading && notifications.length">
      <article class="notification-card" *ngFor="let notification of notifications" [class.unread]="!notification.read">
        <div class="meta">
          <span class="icon">
            <i class="bi" [ngClass]="notification.read ? 'bi-file-text' : 'bi-bell-fill'"></i>
          </span>
          <div>
            <p class="timestamp">{{ notification.createdAt | date: 'MMM d, y • h:mm a' }}</p>
            <p class="message">{{ notification.message }}</p>
          </div>
          <span *ngIf="!notification.read" class="badge">New</span>
        </div>
        <div class="actions">
          <button type="button" class="ghost" (click)="onNotificationClick(notification)">View post</button>
          <button type="button" class="ghost danger">Delete</button>
        </div>
      </article>
    </div>

    <div class="empty-state" *ngIf="!loading && !notifications.length">
      <span>✨</span>
      <p>You're all caught up. We'll let you know when something happens.</p>
    </div>

    <div class="load-more" *ngIf="!loading && hasMore">
      <button type="button" (click)="loadMore()">Load more</button>
    </div>
  </div>
</section>
