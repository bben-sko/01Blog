<section class="auth-shell">
  <div class="auth-panel">
    <div class="hero-pane">
      <p class="eyebrow">Join the community</p>
      <h1>Create an account to publish, comment, and curate your favorite reads.</h1>
      <p class="subcopy">Upload a profile image, share a short bio, and start crafting your presence.</p>
    </div>
    <div class="form-pane">
      <h2>Create account</h2>
      <p class="helper">Already have one? <a [routerLink]="'/login'">Sign in</a></p>

      <div class="input-grid">
        <div class="field">
          <label for="username">Username</label>
          <input id="username" type="text" [(ngModel)]="registerData.username" placeholder="username" />
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email" [(ngModel)]="registerData.email" placeholder="email@domain.com" />
        </div>
        <div class="field">
          <label for="name">Full name</label>
          <input id="name" type="text" [(ngModel)]="registerData.name" placeholder="Your name" />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" type="password" [(ngModel)]="registerData.password" placeholder="••••••••" />
        </div>
      </div>

      <div class="field">
        <label for="bio">Bio</label>
        <textarea id="bio" rows="3" [(ngModel)]="registerData.bio" placeholder="Share a short introduction..."></textarea>
      </div>

      <div class="upload" (click)="avatarInput.click()">
        <div>
          <strong>Upload avatar</strong>
          <p>{{ file?.name || 'PNG or JPG up to 2MB' }}</p>
        </div>
        <button type="button">Browse</button>
        <input type="file" accept="image/*" #avatarInput (change)="onFileSelected($event)" hidden>
      </div>

      <button class="primary" type="button" (click)="register()">Create account</button>
      <p class="error" *ngIf="error">{{ error }}</p>
    </div>
  </div>
</section>
