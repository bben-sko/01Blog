<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
            <div class="card shadow">
                <div class="card-body p-4">
                    <h3 class="card-title text-center mb-4">Login</h3>


                    <div class="mb-3">
                        <label for="Username" class="form-label">Username </label>
                        <input type="Username" class="form-control" id="Username" name="Username"
                            [(ngModel)]="registerData.username" required Username [ngClass]="{ 'is-invalid': submitted  }"
                            placeholder="Enter email">
                        <!-- <div class="invalid-feedback" *ngIf="submitted ">
                                <div *ngIf="email.errors?.['required']">Email is required</div>
                                <div *ngIf="email.errors?.['email']">Please enter a valid email</div>
                            </div> -->
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label">Email address</label>
                        <input type="email" class="form-control" id="email" name="email" [(ngModel)]="registerData.email" required email
                            [ngClass]="{ 'is-invalid': submitted  }" placeholder="Enter email">
                        <!-- <div class="invalid-feedback" *ngIf="submitted ">
                                                    <div *ngIf="email.errors?.['required']">Email is required</div>
                                                    <div *ngIf="email.errors?.['email']">Please enter a valid email</div>
                                                </div> -->
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password" [(ngModel)]="registerData.password" required
                            minlength="6" [ngClass]="{ 'is-invalid': submitted  }" placeholder="Password">
                        <!-- <div class="invalid-feedback" *ngIf="submitted ">
                                                    <div *ngIf="password.errors?.['required']">Password is required</div>
                                                    <div *ngIf="password.errors?.['minlength']">Password must be at least 6 characters</div>
                                                </div> -->
                    </div>
                    <div class="mb-3">
                        <label for="name" class="form-label">name</label>
                        <input type="name" class="form-control" id="name" name="name" [(ngModel)]="registerData.name" required name
                            [ngClass]="{ 'is-invalid': submitted  }" placeholder="Enter name">
                        <!-- <div class="invalid-feedback" *ngIf="submitted ">
                                                    <div *ngIf="email.errors?.['required']">Email is required</div>
                                                    <div *ngIf="email.errors?.['email']">Please enter a valid email</div>
                                                </div> -->
                    </div>
                    <div class="mb-3">
                        <label for="bio" class="form-label">bio</label>
                        <input type="bio" class="form-control" id="bio" name="bio" [(ngModel)]="registerData.bio"
                            [ngClass]="{ 'is-invalid': submitted  }" placeholder="Enter bio">
                        <!-- <div class="invalid-feedback" *ngIf="submitted ">
                                                    <div *ngIf="email.errors?.['required']">Email is required</div>
                                                    <div *ngIf="email.errors?.['email']">Please enter a valid email</div>
                                                </div> -->
                    </div>
                    <div class="mb-3">
                        <label for="avatar" class="form-label">avatar</label>
                        <input type="avatar" class="form-control" id="avatar" name="avatar" [(ngModel)]="registerData.avatar"
                            [ngClass]="{ 'is-invalid': submitted  }" placeholder="Enter avatar">
                        <!-- <div class="invalid-feedback" *ngIf="submitted ">
                                                                        <div *ngIf="email.errors?.['required']">Email is required</div>
                                                                        <div *ngIf="email.errors?.['email']">Please enter a valid email</div>
                                                                    </div> -->
                    </div>


                    <!-- Password Input -->
                   

                    <!-- Remember Me & Forgot Password -->


                    <!-- Submit Button -->
                    <button type="submit" (click)="d()" class="btn btn-primary w-100">
                        Sign In
                    </button>
                    <p>{{ error }}</p>
                    <!-- Register Link -->
                <div class="text-center mt-3">
                    <p class="mb-0">
                        Do you have an account? <a [routerLink]="'/login'" class="text-decoration-none">Login</a>
                    </p>
                </div>


                </div>
            </div>
        </div>
    </div>
</div>
